services:
  - type: web
    name: groundwork
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    # Free plan has no persistent disk, so DATABASE_PATH/DATA_DIR are left
    # unset and the app falls back to ./groundwork.db and ./data/ on the
    # service's ephemeral filesystem — meaning logged meals, weights, and
    # AI-learned foods can reset on restarts/redeploys. Fine for trying the
    # app out for free; upgrade to a paid plan + disk (see README) if you
    # want that data to actually persist.
    envVars:
      # Secrets — set actual values in the Render dashboard, not here.
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Gates the whole app behind HTTP Basic Auth once set — strongly
      # recommended once this is reachable from the public internet instead
      # of just home WiFi. See app.py's _require_basic_auth().
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
