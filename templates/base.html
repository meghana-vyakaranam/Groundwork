<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Groundwork{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">

  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 22c0-6 3-9 3-14a3 3 0 0 0-6 0c0 5 3 8 3 14z"/></svg></div>
    <span class="brand-name">Groundwork</span>
  </div>

  {% block content %}{% endblock %}

</div>
{% block scripts %}{% endblock %}
</body>
</html>
